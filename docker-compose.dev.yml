services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.timescale
      args:
        - DEV=true
    image: mosquito-alert/metrics-db
    container_name: metrics-db
    hostname: db
    ports:
      - "5432:5432"
    volumes:
      - metrics-db_data:/var/lib/postgresql/data
      - metrics-db_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres.env
    # command: "-c log_statement=all"

  redis:
    image: redis:7.0.15
    container_name: metrics-redis
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - metrics-redis_data:/data
    env_file:
      - ./.envs/.local/.django.env

  broker:
    image: rabbitmq:4.1.0-management
    container_name: metrics-broker
    hostname: broker
    configs:
      - source: plugins
        target: /etc/rabbitmq/enabled_plugins
    env_file:
      - ./.envs/.local/.django.env
    ports:
      - "5672:5672"
      - "15672:15672"

  api: &api
    build:
      context: .
      args:
        - DEV=true
    image: mosquito-alert/metrics-api
    container_name: metrics-api
    hostname: api
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/app
    env_file:
      - ./.envs/.local/.django.env
      - ./.envs/.local/.postgres.env
    healthcheck:
      test: "curl -f http://localhost:8000/ping/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - db
      - broker
    command: /scripts/start

  worker:
    <<: *api
    container_name: metrics-worker
    hostname: worker
    ports: []
    command: /scripts/start_worker

  worker_flower:
    <<: *api
    container_name: metrics-flower
    hostname: flower
    ports:
      - "5556:5555"
    command: /scripts/start_flower

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.x
    container_name: metrics-geoserver
    hostname: geoserver
    ports:
      - "8080:8080"


volumes:
  metrics-db_data:
  metrics-db_data_backups:
  metrics-redis_data:

configs:
  plugins:
    content: "[rabbitmq_federation_management,rabbitmq_management,rabbitmq_mqtt,rabbitmq_stomp]."
